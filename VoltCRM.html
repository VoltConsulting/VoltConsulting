async function getGraphToken() {

// Sends via the signed-in user's own Outlook 365 mailbox. Graph's
// default behaviour already saves a copy to Sent Items automatically
// — that's not something this code has to arrange, Microsoft does it.
// Sent as HTML so the branded signature (logo, bold name, link)
// actually renders rather than showing as plain text.
async function sendGraphMail(to, subject, body) {
  var token = await getGraphToken();
  var senderEmail = getConnectedOutlookAccount();
  var escapedBody = body.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // does not reliably honour white-space:pre-wrap — paragraph spacing and
  // line breaks can silently collapse into one block for the recipient even
  // though it looks correct in the compose box. Converting every newline
  // into a real <br> tag is the actual fix: it renders correctly everywhere,
  // Outlook included, regardless of how that client handles CSS whitespace.
  var bodyWithBreaks = escapedBody.replace(/\n/g, "<br>");

async function atGet(url) {

    headers: {

// A transient blip — WiFi dropping for a second, Airtable briefly rate
// limiting or erroring — used to mean the whole write for that batch was
// silently lost: nothing retried it, and nothing told the person it had
// failed. The data looked saved locally right up until their next refresh
// pulled the real, incomplete state from Airtable. This retries genuinely
// transient failures automatically before giving up, and reports success
// count so a persistent, non-transient failure can be raised to the user
// rather than swallowed.
async function fetchWithRetry(url, options, maxRetries, safeOnNetworkError) {
  maxRetries = maxRetries == null ? 3 : maxRetries;
  safeOnNetworkError = safeOnNetworkError !== false;
  var lastErr = null;
  for (var attempt = 0; attempt <= maxRetries; attempt++) {
    var res = null;
    try {
      res = await fetch(url, options);
    } catch (e) {
      // The connection dropped before any response came back at all - we
      // genuinely don't know whether the server received and processed the
      // request or not. That's harmless to retry for an update (reapplying
      // the same change twice does nothing extra), but not for a create -
      // if the record was actually made just before the connection dropped,
      // retrying would create a duplicate. Only retry this specific case
      // when the caller has told us it's safe to.
      if (!safeOnNetworkError) throw e;
      lastErr = e;
    }
    if (res) {
      if (res.ok) return res;
      // A bad request or auth failure will never succeed just by trying
      // again - fail immediately rather than wasting retries on it.
      if (res.status !== 429 && res.status < 500) {
        throw new Error("AT " + res.status + " " + (await res.text()));
      }
      // The server itself explicitly rejected this one (rate limited or
      // erroring) - we KNOW for certain nothing was created, so this is
      // always safe to retry regardless of create vs update.
      lastErr = new Error("AT " + res.status + " " + (await res.text()));
    }
    if (attempt < maxRetries) {
      await new Promise(function (r) { setTimeout(r, 400 * Math.pow(2, attempt)); });

}

// ── Per-row Airtable layer (async/await version) ──────────────
// Each record is its own Airtable row. No single blob.

async function atListAll() {
  let records = [],
    offset = null;
  const bust = "&_ts=" + Date.now();
  do {
    const data = await atGet(AT_URL + "?pageSize=100" + bust + (offset ? "&offset=" + offset : ""));
    records = records.concat(data.records || []);
    offset = data.offset || null;
  } while (offset);
  return records;
}
async function loadFromAirtable() {
  const records = await atListAll();
  const people = [],
    companies = [],
    network = [],
    vacancies = [],
    specouts = [],
    templates = [];
  for (const rec of records) {
    const rt = (rec.fields.RecordType || "").toUpperCase();
    const dataStr = rec.fields.Data || "[]";
    try {
      if (rt === "PERSON") {
        const p = JSON.parse(dataStr);
        p._recId = rec.id;
        people.push(p);
        _lastSyncedJSON[rec.id] = JSON.stringify(p);
      } else if (rt === "COMPANY") {
        const c = JSON.parse(dataStr);
        c._recId = rec.id;
        companies.push(c);
        _lastSyncedJSON[rec.id] = JSON.stringify(c);
      } else if (rt === "NETWORK") {
        const n = JSON.parse(dataStr);
        n._recId = rec.id;
        network.push(n);
        _lastSyncedJSON[rec.id] = JSON.stringify(n);
      } else if (rt === "VACANCY") {
        const v = JSON.parse(dataStr);
        v._recId = rec.id;
        vacancies.push(v);
        _lastSyncedJSON[rec.id] = JSON.stringify(v);
      } else if (rt === "SPECOUT") {
        const s = JSON.parse(dataStr);
        s._recId = rec.id;
        specouts.push(s);
        _lastSyncedJSON[rec.id] = JSON.stringify(s);
      } else if (rt === "TEMPLATE") {
        const t = JSON.parse(dataStr);
        t._recId = rec.id;
        templates.push(t);
        _lastSyncedJSON[rec.id] = JSON.stringify(t);
      }
    } catch (e) {
      console.warn("Parse error", rec.id, e);
    }
  }
  if (people.length) localStorage.setItem("voltcrm5-people", JSON.stringify(people));
  if (companies.length) localStorage.setItem("voltcrm5-companies", JSON.stringify(companies));
  if (network.length) localStorage.setItem("voltcrm5-network", JSON.stringify(network));
  if (vacancies.length) localStorage.setItem("voltcrm5-vacancies", JSON.stringify(vacancies));
  if (specouts.length) localStorage.setItem("voltcrm5-specouts", JSON.stringify(specouts));
  if (templates.length) localStorage.setItem("voltcrm5-templates", JSON.stringify(templates));
  return {
    people,
    companies,
    network,
    vacancies,
    specouts,
    templates
  };
}
var _saveLocks = {};
// Registry of record ids already created in Airtable this session, keyed by the
// person/company's own stable id (id: Date.now() from creation). If a racing or
// repeated save tries to create the same new record again, we skip it. This is
// the hard stop for the "one manual add -> several cards" duplicate bug.
var _createdIds = {};
// What was actually last written to Airtable for each record, keyed by its
// Airtable _recId, as the exact JSON.stringify() this same code would produce.
// Populated on load (see loadFromAirtable) and updated after each successful
// write. Every save used to resend the ENTIRE table — ~780 people in batches
// of 10, sequentially, taking 20-40+ seconds — because there was no way to
// tell which records had genuinely changed. Any navigation, tab close, or a
// second save queued behind it during that window meant whatever hadn't been
// sent yet was simply never written, even though the local UI already showed
// it as done. This cache lets a save skip everyone whose data hasn't actually
// changed, so a real save is one record, not the whole table.
var _lastSyncedJSON = {};

// like most databases, doesn't always make a write instantly visible to a
// read a moment later - there's a brief real lag. Without tracking this,
// the periodic background refresh (see App's useEffect) could read Airtable
// in that exact narrow window, see what looks like an "older" version of a
// record this session had just correctly saved, and wrongly conclude some
// other session must have changed it - silently undoing your own
// just-completed save. Any record written by this session within the last
// two refresh cycles is left alone regardless of what a read shows, to give
// Airtable's own consistency time to catch up.
var _lastWrittenAt = {};
async function saveToAirtable(name, data) {
  const _n = (name || "").toLowerCase();
  const recType = _n === "people" ? "PERSON" : _n === "companies" ? "COMPANY" : _n === "network" ? "NETWORK" : _n === "specouts" ? "SPECOUT" : _n === "templates" ? "TEMPLATE" : "VACANCY";

  // Prevent two saves of the same record type running at once. Without
  // this, a brand-new person (no _recId yet) can be sent to Airtable by
  // one save while a second overlapping save still sees them as new and
  // creates them again, producing multiple cards from one entry. We wait
  // for any in-flight save of this type to finish first.
  while (_saveLocks[recType]) {
    await new Promise(function (r) { setTimeout(r, 60); });
  }
  _saveLocks[recType] = true;
  try {
    return await _saveToAirtableInner(name, data, recType);
  } finally {
    _saveLocks[recType] = false;
  }
}
async function _saveToAirtableInner(name, data, recType) {
  var items = data || [];

  // ── DUPLICATE GUARD (in-memory, ZERO extra API calls) ────────
  // The previous version re-fetched the entire table from Airtable on
  // every save to check for duplicate names. With hundreds of records
  // that was 6+ API calls per save and was exhausting the monthly limit.
  // Instead we dedup against the data array itself (which already holds
  // the full current dataset in memory): if two items share the same
  // name and only one has a _recId, give the ID-less one that _recId so
  // it updates instead of creating a second copy. No network calls.
  var idByName = {};
  items.forEach(function (x) {
    var key = ((x.name || x.title || "") + "").trim().toLowerCase();
    if (key && x._recId && !idByName[key]) idByName[key] = x._recId;
  });
  items.forEach(function (x) {
    if (!x._recId) {
      var key = ((x.name || x.title || "") + "").trim().toLowerCase();
      if (key && idByName[key]) x._recId = idByName[key];
    }
  });

  // Split into new (no _recId) and existing (has _recId)
  var toCreate = items.filter(function (x) {
    return !x._recId;
  });

  // this is the actual fix for saves silently resending (and re-risking) the
  // entire table on every single edit.
  var toUpdate = items.filter(function (x) {
    if (!x._recId) return false;

      setTimeout(r, ms);

  // Guard: drop any item whose own id was already created in Airtable this
  // session (a racing/repeated save of the same new record). If it was already
  // created, adopt the known _recId so it updates instead of duplicating.
  toCreate = toCreate.filter(function (x) {
    if (x.id != null && _createdIds[x.id]) {
      x._recId = _createdIds[x.id];
      return false;
    }
    return true;
  });
  var createBatches = chunk(toCreate, 10);
  for (var ci = 0; ci < createBatches.length; ci++) {
    var batch = createBatches[ci];
    var records = batch.map(function (item) {
      var nameField = item.name || item.title || "Record " + (item.id || "");
      return {
        fields: {
          Name: nameField,
          RecordType: recType,
          Data: JSON.stringify(item)

      };
    });

      records: records

      batch[idx]._recId = r.id;
      if (batch[idx].id != null) _createdIds[batch[idx].id] = r.id;
      _lastSyncedJSON[r.id] = JSON.stringify(batch[idx]);
      _lastWrittenAt[r.id] = Date.now();

  }

  // UPDATE in batches of 10
  var updateBatches = chunk(toUpdate, 10);
  for (var ui = 0; ui < updateBatches.length; ui++) {
    var ubatch = updateBatches[ui];
    var urecords = ubatch.map(function (item) {
      var nameField = item.name || item.title || "Record " + (item.id || "");
      return {
        id: item._recId,
        fields: {
          Name: nameField,
          RecordType: recType,
          Data: JSON.stringify(item)
        }
      };
    });
    await atPatch(AT_URL, {
      records: urecords
    });
    ubatch.forEach(function (item) {
      _lastSyncedJSON[item._recId] = JSON.stringify(item);
      _lastWrittenAt[item._recId] = Date.now();
    });
    if (ui < updateBatches.length - 1) await delay(250);
  }
}

// Simple localStorage shim for CRM internal cache
window.storage = {
  get: async k => {
    try {
      const v = localStorage.getItem(k);
      return v ? {
        key: k,
        value: v
      } : null;
    } catch (e) {
      return null;
    }
  },
  set: async (k, v) => {
    try {
      localStorage.setItem(k, v);
      return {
        key: k,
        value: v
      };
    } catch (e) {
      return null;
    }
  },
  delete: async k => {
    try {
      localStorage.removeItem(k);
      return {
        key: k,
        deleted: true
      };
    } catch (e) {
      return null;
    }
  },
  list: async prefix => {
    try {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return {
        keys
      };
    } catch (e) {
      return {
        keys: []
      };
    }
  }
};
